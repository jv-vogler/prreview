name: Release

on:
  push:
    tags: ['v*']

permissions:
  # id-token lets npm mint provenance attestations and (when configured on
  # npmjs.com) authenticate via trusted publishing — no long-lived token.
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; node 22 bundles npm 10.
      # Harmless when falling back to an NPM_TOKEN secret instead.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: scripts/verify-pack.sh
      - run: npm publish --provenance --access public
        env:
          # Empty when the owner configured npm trusted publishing (preferred);
          # then OIDC authenticates the publish and this variable is unused.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
