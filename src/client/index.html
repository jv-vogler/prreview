<!doctype html>
<html lang="en" data-color-mode="dark" data-dark-theme="dark" data-resolved-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>prreview</title>
		<!-- Every visible glyph in the app is set in this face; loading it
		     late enough for CSS discovery costs a visible reflow when the
		     fallback font's metrics differ, which Mona Sans's do. -->
		<link
			rel="preload"
			href="/fonts/MonaSansVF.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
